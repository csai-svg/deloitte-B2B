<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in — Deloitte Merchandise Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div class="wrap" style="max-width:420px;padding-top:64px;padding-bottom:64px">
    <div style="text-align:center;margin-bottom:28px">
      <img src="assets/brand/logo.png" alt="Deloitte" style="height:34px;object-fit:contain">
    </div>

    <div class="card" style="padding:28px 24px">
      <h1 style="font-size:1.15rem;margin:0 0 6px">Sign in to continue</h1>
      <p class="small" style="color:var(--muted);margin:0 0 20px">
        This store is only available to people with a Deloitte store account.
      </p>

      <form id="login-form">
        <label class="field">
          <span>Username</span>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field" style="margin-top:12px">
          <span>Password</span>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" id="submit-btn" class="btn btn-block" style="margin-top:18px">Sign in</button>
      </form>
      <p id="login-status" class="small" style="color:#b00020;margin-top:14px;min-height:1em"></p>

      <p class="small" style="margin-top:6px;color:var(--muted)">
        Need access? Contact your CompanyStore account manager.
      </p>
    </div>
  </div>
</main>

<script src="assets/js/app.js"></script>
<script>
(function () {
  const form = document.getElementById('login-form');
  const usernameI = document.getElementById('username');
  const passwordI = document.getElementById('password');
  const submitBtn = document.getElementById('submit-btn');
  const status = document.getElementById('login-status');

  const params = new URLSearchParams(location.search);
  if (params.get('expired')) status.textContent = 'Session expired, please sign in again.';

  let submitting = false;

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (submitting) return;
    const username = usernameI.value.trim();
    const password = passwordI.value;
    if (!username || !password) { status.textContent = 'Enter your username and password.'; return; }

    submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    status.style.color = '#b00020';
    status.textContent = '';

    try {
      const d = await api('login', { username, password });
      Auth.set(d.token, {
        username: username.toLowerCase(), name: d.name, expires: d.expires,
        features: d.features || {}, role: d.role || 'user', mustChange: !!d.must_change,
      });
      status.style.color = 'var(--brand)';
      status.textContent = 'Signed in. Redirecting…';
      location.href = d.must_change ? 'change-password.html' : (params.get('next') || 'index.html');
    } catch (err) {
      status.textContent = err.message || 'Sign-in failed. Check your connection and try again.';
      submitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
