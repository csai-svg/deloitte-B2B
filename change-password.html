<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(!sessionStorage.getItem('cs_session')){location.replace('login.html?next=change-password.html');}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Change password — Deloitte Merchandise Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main>
  <div class="wrap" style="max-width:420px;padding-top:64px;padding-bottom:64px">
    <div style="text-align:center;margin-bottom:28px">
      <img src="assets/brand/logo.png" alt="Deloitte" style="height:34px;object-fit:contain">
    </div>

    <div class="card" style="padding:28px 24px">
      <h1 style="font-size:1.15rem;margin:0 0 6px" id="cp-title">Change your password</h1>
      <p class="small" id="cp-sub" style="color:var(--muted);margin:0 0 20px">
        Choose a new password for your account.
      </p>

      <form id="cp-form">
        <label class="field" id="cp-current-field">
          <span>Current password</span>
          <input type="password" id="cp-current" autocomplete="current-password">
        </label>
        <label class="field" style="margin-top:12px">
          <span>New password</span>
          <input type="password" id="cp-new" autocomplete="new-password" required minlength="10">
        </label>
        <label class="field" style="margin-top:12px">
          <span>Confirm new password</span>
          <input type="password" id="cp-confirm" autocomplete="new-password" required minlength="10">
        </label>
        <button type="submit" id="cp-submit" class="btn btn-block" style="margin-top:18px">Change password</button>
      </form>
      <p id="cp-status" class="small" style="color:#b00020;margin-top:14px;min-height:1em"></p>
    </div>
  </div>
</main>

<script src="assets/js/app.js"></script>
<script>
(function () {
  const form = document.getElementById('cp-form');
  const currentI = document.getElementById('cp-current');
  const newI = document.getElementById('cp-new');
  const confirmI = document.getElementById('cp-confirm');
  const submitBtn = document.getElementById('cp-submit');
  const status = document.getElementById('cp-status');

  const u = Auth.user();
  const forced = !!(u && u.mustChange);
  if (forced) {
    document.getElementById('cp-title').textContent = 'Set a new password';
    document.getElementById('cp-sub').textContent = 'Your account needs a new password before you can continue.';
    document.getElementById('cp-current-field').style.display = 'none';
    currentI.required = false;
  } else {
    currentI.required = true;
  }

  let submitting = false;

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (submitting) return;
    const newPw = newI.value;
    const confirmPw = confirmI.value;
    if (newPw.length < 10) { status.textContent = 'New password must be at least 10 characters.'; return; }
    if (newPw !== confirmPw) { status.textContent = 'New password and confirmation do not match.'; return; }

    submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Changing…';
    status.style.color = '#b00020';
    status.textContent = '';

    try {
      const d = await api('change_password', { current_password: currentI.value, new_password: newPw });
      const cur = Auth.user() || {};
      Auth.set(d.token, { ...cur, mustChange: false });
      status.style.color = 'var(--brand)';
      status.textContent = 'Password changed. Redirecting…';
      location.href = 'index.html';
    } catch (err) {
      status.textContent = err.message || 'Could not change password. Try again.';
      submitting = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Change password';
    }
  });
})();
</script>
</body>
</html>
